<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wand und Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="film.css">
<style>
:root{--sweep:#e9eef6;--wall:#0d1015;--strip:#171b22;--cell:#131820;--cellLine:#1c222c;--warm:255,226,186}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08090c;color:#ddd;font-family:Barlow,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;overflow:hidden;cursor:grab}
#world{position:absolute;left:0;top:0;width:8400px;height:1260px;transform-origin:0 0;background:var(--wall)}
/* wall */
.strip{position:absolute;left:0;width:8400px;height:180px;background:var(--strip)}
.strip span{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#4a5260;font-weight:600;white-space:nowrap}
.wallsep{position:absolute;top:0;width:4px;height:1260px;background:#2b3240}
.cell{position:absolute;width:240px;height:180px;border:2px solid var(--cellLine);background:var(--cell)}
.door{position:absolute;background:#050608;border:3px solid #3a2a1e}
.door span{position:absolute;left:24px;top:24px;font-size:24px;letter-spacing:.14em;color:#6d5440;font-weight:600}
/* exhibits */
.ex{position:absolute}
.ex .body{position:absolute;inset:4px;background:#1d232d;overflow:hidden;box-shadow:inset 0 0 0 2px #262e3a}
.ex .lit{position:absolute;inset:0;opacity:0;background:rgb(var(--warm))}
/* picture mode: Airtable image fills the compartment; light = full brightness + flat warm frame instead of a fill */
.ex .pic{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
body.pics .ex .pic{display:block}
body.pics .ex .lit{background:none;box-shadow:inset 0 0 0 10px rgb(var(--warm))}
body.pics .ex .nm{right:auto;max-width:calc(100% - 24px);background:rgba(13,16,21,.82);padding:4px 8px;color:#c3cad6}
body.pics .ex .id{background:rgba(13,16,21,.82);padding:2px 6px}
.ex .bar{position:absolute;left:0;right:0;bottom:0;height:8px;opacity:.85}
.ex .nm{position:absolute;left:16px;right:12px;top:12px;font-size:24px;line-height:1.15;font-weight:600;color:#8a93a3;overflow:hidden;max-height:calc(100% - 30px)}
.ex .id{position:absolute;right:14px;bottom:14px;font-size:20px;font-weight:600;color:#58606d;letter-spacing:.04em}
body.nolabels .ex .nm,body.nolabels .ex .id{display:none}
.ex.k2 .body{box-shadow:inset 0 0 0 2px #3a3326}
/* motion light: flat fills, exactly one compartment each – no glow, no soft fields */
#sweep{position:absolute;inset:0;pointer-events:none;z-index:2}
#sweep div{position:absolute;width:232px;height:172px;margin:4px 0 0 4px;opacity:0;background:var(--sweep)}
/* film sits in the wall at the media surface: B g6–m2 = cols 14–20, rows 1–5 */
#stage{left:3360px;top:180px;box-shadow:0 0 0 3px #2c3340}
/* hud */
#hud{flex:none;padding:10px 16px 12px;background:#0f1115;border-top:1px solid #23262d}
#info{font-size:13px;color:#aaa;line-height:1.5;min-height:40px;text-align:center}
#info b{color:#c79be0;font-weight:600}
#info .spot{color:#ffd166}
#info .warn{color:#ff8a65}
#info .lit{color:#ffe2b8}
#ui{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:13px;color:#aaa;margin-top:8px}
#ui button{background:#2a2a2e;color:#ddd;border:1px solid #3a3a3f;border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap}
#ui button.on{background:#6b2a8c;border-color:#8a3fb0;color:#fff}
#ui label{display:flex;align-items:center;gap:8px;margin-left:8px}
#zoom{width:220px;accent-color:#c79a5a}
#bar{position:absolute;left:0;bottom:0;height:3px;background:#8a3fb0;width:0;z-index:2}
body.clean #hud{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="view"><div id="world"><div id="wall"></div><div id="sweep"></div><div id="stage"></div></div><div id="bar"></div></div>
  <div id="hud">
    <div id="info"></div>
    <div id="ui">
      <button id="play">Pause</button>
      <button id="prev">◀</button><button id="next">▶</button>
      <span id="moments"></span>
      <button id="tempo">Standzeit ×1</button>
      <label>Zoom <button id="zMedia">Medienfläche</button><input type="range" id="zoom" min="0" max="1" step="0.001" value="0"><button id="zWall">Ganze Wand</button></label>
      <button id="section" class="on">Testschleife M2</button>
      <button id="inv">Invertieren</button>
      <button id="labels" class="on">Beschriftung</button>
      <button id="pics">Bilder</button>
      <button id="fs">Vollbild</button>
    </div>
  </div>
</div>

<script src="choreo.js"></script>
<script src="wand-data.js"></script>
<script src="film.js"></script>
<script>
/* ================= Wand ================= */
const CW=240,CH=180;                          // eine Zelle = 80 × 60 cm, gleiche Pixel wie im Film
const WW=WAND.COLS*CW,WH=WAND.ROWS*CH;
const wall=document.getElementById('wall');
const {objs,warn}=WAND.layout();
const el=(cls,css,html='')=>{const d=document.createElement('div');d.className=cls;Object.assign(d.style,css);d.innerHTML=html;wall.appendChild(d);return d};
// top / bottom row: no compartments any more – drawn as wall, never lit individually
[0,WAND.ROWS-1].forEach(y=>{const s=el('strip',{top:y*CH+'px'});
  Object.entries(WAND.WALLS).forEach(([n,w])=>{const t=document.createElement('span');t.style.left=(w.off*CW+30)+'px';t.textContent=(y===0?'Wand '+n+' · ':'')+'keine Fächer';s.appendChild(t)})});
// field cells (rows 1–5) except media and door
const inRect=(x,y,r)=>x>=r.c0&&x<=r.c1&&y>=r.y0&&y<=r.y1;
for(let y=WAND.FIELD_ROWS[0];y<=WAND.FIELD_ROWS[1];y++)for(let x=0;x<WAND.COLS;x++)
  if(!inRect(x,y,WAND.MEDIA)&&!inRect(x,y,WAND.DOOR))el('cell',{left:x*CW+'px',top:y*CH+'px'});
const D=WAND.DOOR;el('door',{left:D.c0*CW+'px',top:D.y0*CH+'px',width:(D.c1-D.c0+1)*CW+'px',height:(D.y1-D.y0+1)*CH+'px'},'<span>FLUCHTWEGTÜR</span>');
Object.values(WAND.WALLS).forEach(w=>{if(w.off)el('wallsep',{left:(w.off*CW-2)+'px'})});

// exhibits
const EX={};                                  // Fach-ID → {el, light, level}
objs.forEach(o=>{if(!o.rect)return;const r=o.rect;
  const d=el('ex'+(o.story.includes('2')?' k2':''),{left:r.x*CW+'px',top:r.y*CH+'px',width:r.w*CW+'px',height:r.h*CH+'px'},
    `<div class="body"><div class="pic" style="background-image:url('${(window.ASSETS&&window.ASSETS['exponate/'+o.id+'.jpg'])||'assets/exponate/'+o.id+'.jpg'}')"></div><div class="lit"></div><div class="bar" style="background:${o.color}"></div><div class="nm">${o.name}</div><div class="id">${o.id}</div></div>`);
  d.title=`${o.name} · ${o.id} · ${o.cluster}`;
  EX[o.id]={o,d,pic:d.querySelector('.pic'),lit:d.querySelector('.lit'),nm:d.querySelector('.nm'),level:0,target:0};
});

/* ================= Licht = Film =================
   Jede Kachel, die ein Exponat zeigt, schaltet dessen Fach. Helligkeit = Gewicht × Kachelgröße × Einblendung.
   Klappt eine Kachel weg, verlischt das Licht mit ihr; ein Vollbild setzt einen kurzen Lichtimpuls. */
const K2=['A-A-6','A-C-2','A-D-2','A-A-2','B-E-5','B-B-5','C-A-6','C-A-4','C-A-5','C-D-4','C-C-5','A-G-6'];
const one=(id,w=1)=>[[id,w]],all=w=>K2.map(id=>[id,w]);
const LIGHT={
 's:a2':one('A-A-6',.16),'s:pd':one('A-A-2',.16),'s:pscb':one('C-A-6',.16),'s:procon':one('C-C-5',.16),
 's:det':one('A-C-2',.16),'s:tt':one('A-D-2',.16),'s:mr':one('B-E-5',.16),'s:bremse':one('C-A-5',.16),
 title:all(.22),
 a2:one('A-A-6'),a2lab:one('A-A-6'),a2q:one('A-A-6'),
 det:one('A-C-2'),detlab:one('A-C-2'),detq:one('A-C-2'),tt:one('A-D-2'),ttq:one('A-D-2'),pd:one('A-A-2'),pdq:one('A-A-2'),
 n2:[['A-C-2',.45],['A-D-2',.45],['A-A-2',.45]],
 mrimg:one('B-E-5'),mrvid:one('B-E-5'),mrq:one('B-E-5'),mrf:one('B-E-5'),
 air:one('B-B-5'),airq:one('B-B-5'),airf:one('B-B-5'),n3:one('B-B-5',.6),
 pscb:one('C-A-6'),pscbq:one('C-A-6'),pscbf:one('C-A-6'),discs:[['C-A-4',1],['C-A-6',.6]],feq:one('C-A-4'),n4:[['C-A-6',.5],['C-A-4',.5]],
 chpass:one('C-D-4'),f490:one('C-D-4'),n5:[['C-D-4',.5],['C-A-5',.5]],
 bremse:one('C-A-5'),btitle:one('C-A-5'),bq:one('C-A-5'),bdet:one('C-A-5'),b29:one('C-A-5'),b2213:one('C-A-5'),
 n490:one('C-A-5'),bk:one('C-A-5'),fire:one('C-A-5'),bvon:one('C-A-5'),bz1:one('C-A-5'),bz2:one('C-A-5'),rad:one('C-A-5'),chrear:one('C-D-4',.7),
 pccrash:one('C-C-5'),pcmech:one('C-C-5'),pcq:one('C-C-5'),pcf:one('C-C-5'),esvw:one('A-G-6'),n6:[['C-C-5',.6],['A-G-6',.6]],
 k1:one('A-A-6'),k2:[['A-A-2',1],['A-C-2',.7],['A-D-2',.7]],k3:[['B-E-5',1],['B-B-5',.7]],k4:[['C-A-5',1],['C-A-6',.7],['C-A-4',.7]],k5:[['C-C-5',1],['A-G-6',.7]],
 n7:all(.9),
};
const missing=Object.values(LIGHT).flat().map(x=>x[0]).filter(id=>!EX[id]);
if(missing.length)console.warn('Licht-Zuordnung ohne Fach:',[...new Set(missing)]);

const BR={out:1400,dwell:1700,back:1400,delay:1500};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// target light per Fach at time `now`, derived only from what the film shows (plus the light bridge)
function targets(now){
  const tgt={};
  FILM.SLOTS.forEach(i=>{const t=FILM.tiles[i];if(!t._key||t._fading)return;const L=LIGHT[t._key];if(!L)return;
    const cells=t.offsetWidth*t.offsetHeight/(CW*CH);if(cells<.02)return;
    const size=Math.sqrt(Math.min(1,cells/6)),age=(now-t._shownAt)/1000,ramp=Math.min(1,Math.max(0,age/.7));
    for(const [id,w] of L){let v=w*size*ramp;if(w>=1&&cells>=30&&age<1.8)v+=.45*(1-age/1.8);tgt[id]=Math.max(tgt[id]||0,v)}});
  // light bridge: the referenced object in another chapter lights up for a moment (no travelling spot)
  const B=FILM.BEATS[FILM.cur];
  if(B&&B.bridge&&EX[B.bridge.to]){
    const t=now-FILM.beatStart-B.revealAt-BR.delay,T=BR.out+BR.dwell+BR.back;
    if(t>=0&&t<T&&!B._routed){B._routed=true;route(B.bridge.to,B.bridge.from)}
    if(t>=0&&t<T){const k=t<BR.out?ease(t/BR.out):t<BR.out+BR.dwell?1:1-ease((t-BR.out-BR.dwell)/BR.back);tgt[B.bridge.to]=Math.max(tgt[B.bridge.to]||0,k)}
  }
  return {tgt};
}
let lastT=performance.now(),PICS=false;
function lights(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const {tgt}=targets(now);
  for(const id in EX){const e=EX[id],T=now<(e.holdUntil||0)?0:(tgt[id]||0);e.level+=(T-e.level)*Math.min(1,dt*(T>e.level?7:2.6));
    const v=e.level;e.lit.style.opacity=Math.min(1,v);
    if(PICS){const b=(.28+.72*Math.min(1,v)).toFixed(3);if(e.pb!==b){e.pic.style.opacity=b;e.pb=b}}
    else e.nm.style.color=v>.35?'#2a1f12':'';}
  sweepFrame(now);
  litInfo();
  requestAnimationFrame(lights);
}

/* ================= Bewegungslicht =================
   Jede Kachelbewegung in der Medienfläche läuft in die Fächer daneben weiter – als volle Flächen, exakt im Raster:
   · seitwärts: die Front tritt auf der Seite der Bewegung aus der Medienfläche und füllt Fach für Fach in denselben Reihen
   · auf/ab:    links und rechts der Medienfläche füllen sich die Fächer in der Höhe, die die Kante gerade überstreicht
   Jedes Fach blendet weich ein und aus, mit leicht zufälliger Deckkraft; keine Glows, keine weichen Felder. */
const MO={x:WAND.MEDIA.c0,y:WAND.MEDIA.y0,w:WAND.MEDIA.c1-WAND.MEDIA.c0+1,h:WAND.MEDIA.y1-WAND.MEDIA.y0+1};
const SW={amp:.85,randMin:.35,gain:1.8,reach:7,lateral:3,side:3,rise:180,hold:140,fall:650};
const sweepLayer=document.getElementById('sweep'),SWC=[];
for(let y=WAND.FIELD_ROWS[0];y<=WAND.FIELD_ROWS[1];y++)for(let x=0;x<WAND.COLS;x++){
  if(inRect(x,y,WAND.MEDIA)||inRect(x,y,WAND.DOOR))continue;
  const d=document.createElement('div');d.style.left=x*CW+'px';d.style.top=y*CH+'px';sweepLayer.appendChild(d);SWC.push({x,y,d,v:0})}
// same easing as the tiles: cubic-bezier(.77,0,.18,1)
const bez=(()=>{const x1=.77,y1=0,x2=.18,y2=1,B=(t,a,b)=>3*a*t*(1-t)*(1-t)+3*b*t*t*(1-t)+t*t*t;
  return u=>{let t=u;for(let i=0;i<8;i++){const x=B(t,x1,x2)-u,dx=3*x1*(1-t)*(1-t)+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(dx)<1e-6)break;t-=x/dx;t=Math.min(1,Math.max(0,t))}return B(t,y1,y2)}})();
// moment u∈[0,1] at which the eased motion has covered fraction f
const when=f=>{let lo=0,hi=1;for(let i=0;i<22;i++){const m=(lo+hi)/2;if(bez(m)<f)lo=m;else hi=m}return(lo+hi)/2};
const rnd=()=>SW.randMin+(1-SW.randMin)*Math.random();
let waves=[];
// every moving edge becomes a list of hits: which compartment fills, when, and how strongly
FILM.hooks.step=(moves,dur)=>{
  const now=performance.now(),seen=new Set();
  for(const {from,to} of moves){
    if(FILM.collapsed(from)&&FILM.collapsed(to))continue;           // invisible parking
    for(const [axis,i0,i1,p0,p1] of [['x',0,2,1,3],['y',1,3,0,2]])
      for(const i of [i0,i1]){if(from[i]===to[i])continue;
        const a=from[i],b=to[i],span=[from[p0],from[p1]];if(span[1]-span[0]<=0)continue;
        const key=[axis,a,b,span].join();if(seen.has(key))continue;seen.add(key);
        const hits=[],dist=Math.abs(b-a),dir=Math.sign(b-a);
        SWC.forEach((c,ci)=>{const cx=c.x+.5,cy=c.y+.5;
          if(axis==='x'){                         // front leaves the media on the side of the motion
            const D=dir>0?cx-(MO.x+MO.w):MO.x-cx,row=cy-MO.y;
            if(D<0||D>dist*SW.gain||row<span[0]||row>span[1])return;
            hits.push({ci,at:when(D/(dist*SW.gain))*dur,amp:SW.amp*rnd()*Math.exp(-D/SW.reach)});
          }else{                                  // band at the height of the moving edge, both sides
            const row=cy-MO.y,left=cx<MO.x,dx=left?MO.x-cx:cx-(MO.x+MO.w);
            if(dx<0||dx>SW.lateral||(row-a)*(row-b)>0)return;
            const side=Math.exp(-(left?span[0]:MO.w-span[1])/SW.side);
            hits.push({ci,at:when(Math.abs(row-a)/dist)*dur,amp:SW.amp*rnd()*Math.exp(-dx/SW.lateral)*side});
          }});
        if(hits.length)waves.push({t0:now,hits});
      }}
};
/* Weg zum Highlight: kommt ein Exponat neu ins Licht, läuft die Füllung Fach für Fach von der Medienfläche
   (bzw. bei einer Lichtbrücke vom Ausgangsexponat) in seinen Reihen bis dorthin – das Fach selbst geht erst bei Ankunft an. */
const ROUTE={cellMs:60,ampMin:.6,settle:120};
const SWI={};SWC.forEach((c,i)=>SWI[c.x+','+c.y]=i);
function route(id,originId){
  const e=EX[id];if(!e)return;const now=performance.now();
  if(e.level>.4||(e.routeAt&&now-e.routeAt<3000))return;           // already lit or already on its way
  const r=e.o.rect,o=originId&&EX[originId]?EX[originId].o.rect:{x:MO.x,y:MO.y,w:MO.w,h:MO.h};
  let cols=[];
  if(r.x+r.w<=o.x)for(let x=o.x-1;x>=r.x+r.w;x--)cols.push(x);       // target lies left of the origin
  else if(r.x>=o.x+o.w)for(let x=o.x+o.w;x<r.x;x++)cols.push(x);     // … or right of it
  const hits=[];cols.forEach((x,k)=>{for(let y=r.y;y<r.y+r.h;y++){const ci=SWI[x+','+y];
    if(ci!==undefined)hits.push({ci,at:k*ROUTE.cellMs,amp:ROUTE.ampMin+(1-ROUTE.ampMin)*Math.random()})}});
  if(hits.length)waves.push({t0:now,hits});
  e.routeAt=now;e.holdUntil=now+cols.length*ROUTE.cellMs+ROUTE.settle;
}
FILM.hooks.show=(t,key,instant)=>{if(instant||key.startsWith('s:'))return;
  for(const [id,w] of LIGHT[key]||[])if(w>=.6)route(id)};
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function sweepFrame(now){
  const life=SW.rise+SW.hold+SW.fall;
  waves=waves.filter(w=>w.hits.some(h=>now-w.t0-h.at<life));
  for(const c of SWC)c.v=0;
  for(const w of waves)for(const h of w.hits){const t=now-w.t0-h.at;if(t<0||t>=life)continue;
    const e=t<SW.rise?smooth(t/SW.rise):t<SW.rise+SW.hold?1:1-smooth((t-SW.rise-SW.hold)/SW.fall);
    const c=SWC[h.ci];c.v=Math.max(c.v,h.amp*e)}            // overlapping waves never add up: the stronger one wins
  for(const c of SWC){const v=Math.min(1,c.v);if(Math.abs(v-(c.o||0))>.004){c.d.style.opacity=v.toFixed(3);c.o=v}}
}

/* ================= Kamera: Medienfläche ↔ ganze Wand ================= */
const view=document.getElementById('view'),world=document.getElementById('world'),zoomEl=document.getElementById('zoom');
const M=WAND.MEDIA,MED={x:M.c0*CW,y:M.y0*CH,w:(M.c1-M.c0+1)*CW,h:(M.y1-M.y0+1)*CH};
let zT=0,zC=0;
function camera(){
  const vw=view.clientWidth,vh=view.clientHeight,pad=24;
  const s0=Math.min((vw-2*pad)/MED.w,(vh-2*pad)/MED.h),s1=Math.min((vw-2*pad)/WW,(vh-2*pad)/WH);
  const s=s0*Math.pow(s1/s0,zC);
  const k=(s0/s-1)/(s0/s1-1||1);               // 0 at media, 1 at full wall – linear in visible width
  const cx=(MED.x+MED.w/2)+((WW/2)-(MED.x+MED.w/2))*k,cy=(MED.y+MED.h/2)+((WH/2)-(MED.y+MED.h/2))*k;
  world.style.transform=`translate(${vw/2-cx*s}px,${vh/2-cy*s}px) scale(${s})`;
}
(function camLoop(){zC+=(zT-zC)*.12;if(Math.abs(zT-zC)<1e-4)zC=zT;camera();requestAnimationFrame(camLoop)})();
const setZoom=z=>{zT=Math.max(0,Math.min(1,z));zoomEl.value=zT};
zoomEl.oninput=e=>{zT=+e.target.value};
document.getElementById('zMedia').onclick=()=>setZoom(0);
document.getElementById('zWall').onclick=()=>setZoom(1);
view.addEventListener('wheel',e=>{e.preventDefault();setZoom(zT+e.deltaY*.0012)},{passive:false});
addEventListener('resize',camera);

/* ================= HUD ================= */
const {BEATS,MOMENTS}=FILM;
let infoHead='';
function info(B){
  FILM.BEATS.forEach(b=>b._routed=false);
  const inM=BEATS.filter(b=>b.m===B.m),k=inM.indexOf(B)+1;
  infoHead=`<b>${MOMENTS[B.m]}</b> · Schritt ${k}/${inM.length} — ${B.t} · Register: ${B.reg}${B.warn?` · <span class="warn">⚠ ${B.warn}</span>`:''}`;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===B.m));
}
FILM.hooks.beat=info;
let lastLit='';
function litInfo(){
  const on=Object.values(EX).filter(e=>e.level>.5).sort((a,b)=>b.level-a.level).map(e=>`${e.o.id} ${e.o.name.replace(/\s*\(.*\)/,'')}`);
  const s=infoHead+`<br><span class="lit">Licht: ${on.length?on.join(' · '):'Grundlicht'}</span>`;
  if(s!==lastLit){document.getElementById('info').innerHTML=s;lastLit=s}
}
const mBox=document.getElementById('moments');
MOMENTS.forEach((m,i)=>{const b=document.createElement('button');b.dataset.m=i;b.textContent=i?'M'+i:'Intro';b.title=m;b.onclick=()=>FILM.jump(BEATS.findIndex(x=>x.m===i));mBox.appendChild(b)});
(function bar(){const B=BEATS[FILM.cur];if(B&&FILM.playing){const k=Math.min(1,(performance.now()-FILM.beatStart)/FILM.durOf(B));document.getElementById('bar').style.width=((FILM.cur+k)/BEATS.length*100)+'%'}requestAnimationFrame(bar)})();
function total(){const sec=FILM.totalSec();document.getElementById('tempo').title='Kapitel-Länge ≈ '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+' min'}
document.getElementById('play').onclick=e=>{FILM.setPlaying(!FILM.playing);e.target.textContent=FILM.playing?'Pause':'Play'};
document.getElementById('prev').onclick=()=>FILM.jump(FILM.cur-1);
document.getElementById('next').onclick=()=>FILM.next();
document.getElementById('tempo').onclick=e=>{const T=[0.75,1,1.25,1.5];FILM.setTempo(T[(T.indexOf(FILM.tempo)+1)%T.length]);e.target.textContent='Standzeit ×'+String(FILM.tempo).replace('.',',');total()};
document.getElementById('pics').onclick=e=>{PICS=document.body.classList.toggle('pics');e.target.classList.toggle('on',PICS);if(PICS)Object.values(EX).forEach(x=>{x.pb=null;x.nm.style.color=''})};
addEventListener('keydown',e=>{if(e.key==='i')document.getElementById('pics').click()});
document.getElementById('labels').onclick=e=>{e.target.classList.toggle('on',!document.body.classList.toggle('nolabels'))};
document.getElementById('fs').onclick=()=>{document.body.classList.add('clean');document.documentElement.requestFullscreen?.();setTimeout(camera,60)};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('clean');setTimeout(camera,60)});
document.getElementById('inv').onclick=e=>{e.target.classList.toggle('on',document.body.classList.toggle('inv'))};
addEventListener('keydown',e=>{if(e.key==='n')document.getElementById('inv').click()});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();document.getElementById('play').click()}if(e.key==='ArrowRight')FILM.next();if(e.key==='ArrowLeft')FILM.jump(FILM.cur-1);
  if(e.key>='0'&&e.key<='6')FILM.jump(BEATS.findIndex(x=>x.m===+e.key));if(e.key==='+')setZoom(zT-.1);if(e.key==='-')setZoom(zT+.1);
  if(e.key==='h'){document.body.classList.toggle('clean');setTimeout(camera,60)}});
if(warn.length)console.warn('Wand-Layout:',warn);
const M2=[FILM.BEATS.findIndex(b=>b.m===2),FILM.BEATS.map(b=>b.m).lastIndexOf(2)];
document.getElementById('section').onclick=e=>{const on=!FILM.range;FILM.setRange(on?M2:null);e.target.classList.toggle('on',on);
  e.target.textContent=on?'Testschleife M2':'Ganzes Kapitel';if(on)FILM.jump(M2[0])};
total();FILM.setRange(M2);FILM.start();setTimeout(()=>FILM.jump(M2[0]),350);requestAnimationFrame(lights);
</script>
</body>
</html>
