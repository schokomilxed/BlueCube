<style>
/* Bento-Film · gemeinsame Stile für Film- und Wand-Vorschau */
:root{
  --bg:#1b1b1d; --tile-a:#f4f4f4; --tile-b:#dedede; --ink:#141414; --line:#c9c9c9; --dark:#151517;
  --ease:cubic-bezier(.77,0,.18,1); --step:.85s;
  --gap:2px; --radius:0px; --pad:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
#stage{position:absolute;left:0;top:0;width:1680px;height:900px;transform-origin:0 0;background:var(--line);overflow:hidden}
body.bento #stage{background:#d6d6d6}

.tile{position:absolute;overflow:hidden;border-radius:var(--radius);
  background:radial-gradient(120% 120% at 30% 25%,var(--tile-a),var(--tile-b));
  transition:left var(--step) var(--ease),top var(--step) var(--ease),width var(--step) var(--ease),height var(--step) var(--ease),border-radius .6s ease;
  will-change:left,top,width,height}
body.bento .tile{box-shadow:0 10px 30px rgba(0,0,0,.12)}
body.bento .tile.collapsed{box-shadow:none}

.layer{position:absolute;inset:0;opacity:0;transition:opacity .35s ease}
.layer.on{opacity:1;transition:opacity .5s ease}
/* media enters with an axis-aligned wipe, never a diagonal scale */
.layer.media-l{opacity:1;clip-path:inset(0 100% 0 0);transition:clip-path .35s ease}
.layer.media-l.on{clip-path:inset(0 0 0 0);transition:clip-path .9s var(--ease)}
.layer.dark{background:var(--dark);color:#f2f2f2}

/* text blocks: children rise in one after another */
.layer.txt{padding:46px 44px;display:flex;flex-direction:column;justify-content:center;color:var(--ink)}
.layer.txt.dark{color:#f2f2f2}
.layer.txt.top{justify-content:flex-start}
.layer.txt.bot{justify-content:flex-end}
.layer.txt>*{opacity:0;transform:translateY(28px);transition:opacity .4s ease,transform .4s ease}
.layer.txt.on>*{opacity:1;transform:none;transition:opacity .7s ease,transform .9s var(--ease)}
.layer.txt.on>*:nth-child(2){transition-delay:.12s}
.layer.txt.on>*:nth-child(3){transition-delay:.24s}
.layer.txt.on>*:nth-child(4){transition-delay:.36s}

.kick{font-weight:600;font-size:20px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:18px}
.h{font-weight:700;letter-spacing:.01em;line-height:1.06;text-transform:uppercase}
.h.xxl{font-size:150px;line-height:.95}
.h.xl{font-size:96px}
.h.l{font-size:64px}
.h.m{font-size:46px}
.h.s{font-size:36px}
.meta{font-weight:600;font-size:24px;text-transform:uppercase;margin-top:20px;line-height:1.25}
.q{font-weight:500;font-size:26px;line-height:1.38}
.q.l{font-size:32px}
.n{font-weight:500;font-style:italic;font-size:38px;line-height:1.25}
.n.l{font-size:58px;line-height:1.18}
.n.s{font-size:30px}
.num{font-weight:700;font-size:110px;line-height:1;letter-spacing:-.01em}
.num.s{font-size:84px}
.unit{font-weight:600;font-size:26px;text-transform:uppercase;margin-top:14px;line-height:1.2}
.rule{width:56px;height:4px;background:currentColor;margin:22px 0}

/* media */
.media{position:absolute;inset:0;overflow:hidden;background:#000}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02)}
.media.contain img{object-fit:contain}
.media.white{background:#fff}
.layer.on .media.kb img{animation:kb 10s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
.media .chip{position:absolute;left:28px;bottom:26px;background:#f4f4f4;color:#141414;font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px}
.sil .media{background:#111}
.sil .media img{filter:grayscale(1) contrast(1.15) brightness(.42)}
.sheen::after{content:"";position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.38) 50%,transparent 60%);transform:translateX(-120%)}
.layer.on .sheen::after{animation:sheen 2.4s ease-in-out 1.4s forwards}
@keyframes sheen{to{transform:translateX(120%)}}
.fire::after{content:"";position:absolute;inset:0;mix-blend-mode:screen;background:radial-gradient(60% 80% at 45% 70%,rgba(255,140,20,.55),transparent 70%);opacity:0}
.layer.on .fire::after{animation:flick 1.3s steps(1) infinite}
@keyframes flick{0%{opacity:.25}13%{opacity:.6}27%{opacity:.3}41%{opacity:.75}55%{opacity:.4}69%{opacity:.65}83%{opacity:.2}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Invertieren: weiße Textfelder werden dunkel mit heller Schrift; die Erzählerin-Felder tauschen ins Helle, damit die Register unterscheidbar bleiben */
body.inv{--tile-a:#202227;--tile-b:#141518;--ink:#eef0f3;--line:#2c2f36;--dark:#ececee}
body.inv .layer.txt.dark{color:#141414}
body.inv .media .chip{background:#141518;color:#eef0f3}
</style>
<style>
:root{--sweep:#e9eef6;--wall:#0d1015;--strip:#171b22;--cell:#131820;--cellLine:#1c222c;--warm:255,226,186}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#08090c;color:#ddd;font-family:Barlow,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;overflow:hidden;cursor:grab}
#world{position:absolute;left:0;top:0;width:8400px;height:1260px;transform-origin:0 0;background:var(--wall)}
/* wall */
.strip{position:absolute;left:0;width:8400px;height:180px;background:var(--strip)}
.strip span{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#4a5260;font-weight:600;white-space:nowrap}
.wallsep{position:absolute;top:0;width:4px;height:1260px;background:#2b3240}
.cell{position:absolute;width:240px;height:180px;border:2px solid var(--cellLine);background:var(--cell)}
.door{position:absolute;background:#050608;border:3px solid #3a2a1e}
.door span{position:absolute;left:24px;top:24px;font-size:24px;letter-spacing:.14em;color:#6d5440;font-weight:600}
/* exhibits */
.ex{position:absolute}
.ex .body{position:absolute;inset:4px;background:#1d232d;overflow:hidden;box-shadow:inset 0 0 0 2px #262e3a}
.ex .lit{position:absolute;inset:0;opacity:0;background:rgb(var(--warm))}
/* picture mode: Airtable image fills the compartment; light = full brightness + flat warm frame instead of a fill */
.ex .pic{position:absolute;inset:0;background-size:cover;background-position:center;display:none}
body.pics .ex .pic{display:block}
body.pics .ex .lit{background:none;box-shadow:inset 0 0 0 10px rgb(var(--warm))}
body.pics .ex .nm{right:auto;max-width:calc(100% - 24px);background:rgba(13,16,21,.82);padding:4px 8px;color:#c3cad6}
body.pics .ex .id{background:rgba(13,16,21,.82);padding:2px 6px}
.ex .bar{position:absolute;left:0;right:0;bottom:0;height:8px;opacity:.85}
.ex .nm{position:absolute;left:16px;right:12px;top:12px;font-size:24px;line-height:1.15;font-weight:600;color:#8a93a3;overflow:hidden;max-height:calc(100% - 30px)}
.ex .id{position:absolute;right:14px;bottom:14px;font-size:20px;font-weight:600;color:#58606d;letter-spacing:.04em}
body.nolabels .ex .nm,body.nolabels .ex .id{display:none}
.ex.k2 .body{box-shadow:inset 0 0 0 2px #3a3326}
/* motion light: flat fills, exactly one compartment each – no glow, no soft fields */
#sweep{position:absolute;inset:0;pointer-events:none;z-index:2}
#sweep div{position:absolute;width:232px;height:172px;margin:4px 0 0 4px;opacity:0;background:var(--sweep)}
/* film sits in the wall at the media surface: B g6–m2 = cols 14–20, rows 1–5 */
#stage{left:3360px;top:180px;box-shadow:0 0 0 3px #2c3340}
/* hud */
#hud{flex:none;padding:10px 16px 12px;background:#0f1115;border-top:1px solid #23262d}
#info{font-size:13px;color:#aaa;line-height:1.5;min-height:40px;text-align:center}
#info b{color:#c79be0;font-weight:600}
#info .spot{color:#ffd166}
#info .warn{color:#ff8a65}
#info .lit{color:#ffe2b8}
#ui{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:13px;color:#aaa;margin-top:8px}
#ui button{background:#2a2a2e;color:#ddd;border:1px solid #3a3a3f;border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap}
#ui button.on{background:#6b2a8c;border-color:#8a3fb0;color:#fff}
#ui label{display:flex;align-items:center;gap:8px;margin-left:8px}
#zoom{width:220px;accent-color:#c79a5a}
#bar{position:absolute;left:0;bottom:0;height:3px;background:#8a3fb0;width:0;z-index:2}
body.clean #hud{display:none}
</style>
</head>

<div id="app">

<script>
/* Kapitel 2 – Fahrdynamik & Sicherheit · Grid-Choreografie
   Medienfläche: 7 × 5 Zellen à 80 × 60 cm (560 × 300 cm). Rects sind [x0,y0,x1,y1] in Zellen.
   x0==x1 oder y0==y1 = eingeklappt an einer Kante (unsichtbar).

   Jeder Beat besteht aus Schritten. In einem Schritt bewegt sich jede Kachel nur auf EINER Achse.
   Namen P1–P8 meinen die Positionen des Grundrasters; alle anderen Namen sind Kacheln, die in
   diesem Moment neu hereingeschoben werden ({r, f}: f = Startkante, an der sie eingeklappt warten). */
(function(root){
const COLS=7,ROWS=5,SLOTS=18;
const P={P1:[0,0,2,3],P2:[2,0,5,2],P3:[5,0,7,3],P4:[2,2,3,3],P5:[3,2,5,3],P6:[0,3,3,5],P7:[3,3,4,5],P8:[4,3,7,5]};
// Grundraster: stille Silhouetten nur aktiver Kapitel-2-Exponate (gleiche Belegung bei jeder Rückfaltung)

// silhouettes keyed by the logical names a fold ends with: [P1,P2,P3,P4,P5,P6,P7,P8]

/* folding back to the base grid from the two most common end states */
const foldFromLeftBlock=(L,R1,R2)=>[ // L = big block [0,0,4,5]; R1/R2 = right column halves
  {[L]:[0,0,4,3],z1:e([0,3,4,5],[0,5,4,5])},
  {[L]:[0,0,2,3],[R1]:[2,0,5,3],z2:e([5,0,7,3],[7,0,7,3]),z1:[0,3,3,5],z3:e([3,3,4,5],[4,3,4,5])},
  {[R1]:[2,0,5,2],z4:e([2,2,3,3],[2,3,3,3]),z5:e([3,2,5,3],[3,3,5,3])},
];

const BEATS=[
 {m:0,rebind:true,t:'Grundraster – stille Silhouetten',reg:'ambient',spot:'ruht',hold:3,steps:[],c:{...SIL}},
 {m:0,t:'Kapitel-Titel',reg:'Erzählerin',spot:'ruht',steps:[

 // M1 Leichtbau
 {m:1,t:'Kachel öffnet sich: Audi A2 Karosse',reg:'Ich-Form',spot:'A-A-6 (Audi A2)',steps:[
   {P1:[0,0,4,3],P3:[4,0,7,3]},

   c:{P1:'a2',P3:'a2lab',P8:'a2q'}},
 {m:1,t:'Grid faltet sich zurück',reg:'ambient',spot:'ruht',hold:2.5,steps:[
   {P1:[0,0,4,3],z1:e([0,3,4,5],[0,5,4,5]),P3:[4,0,7,3],P8:[4,3,7,5]},
   {P1:[0,0,2,3],P3:[2,0,5,3],z2:e([5,0,7,3],[7,0,7,3]),z1:[0,3,3,5],z3:e([3,3,4,5],[4,3,4,5])},

   {P1:[0,0,7,5],P3:[7,0,7,3],P8:[7,3,7,5]}],c:{P1:'bremse'}},
 {m:4,t:'Bremse · Steckbrief',reg:'Ich-Form',spot:'C-A-5 (Bremse)',steps:[

   Optional: window.ASSETS = {datei: dataURI} für die eigenständige Version. */
const FILM=(function(){
const W=1680,H=900,COLS=CHOREO.COLS,ROWS=CHOREO.ROWS;
const src=f=>(window.ASSETS&&window.ASSETS[f])||('assets/'+f);

/* ---------- content building blocks ---------- */

const C={
 // silhouettes for the ambient base grid (nur aktive Exponate)
 's:a2':sil('a2.jpg'),'s:pd':sil('phonedial.jpg'),'s:pscb':sil('pscb.jpg'),'s:procon':sil('procon_still.jpg'),

 // M1 Leichtbau

 // M2 Kontaktpunkt

 n2:nar('Leichtbau und Motorkraft enden hier – am letzten Zentimeter zwischen Auto und Asphalt.',{size:'s'}),

 // M3 Kraft kontrollierbar machen
 mrimg:img('magride.jpg',{cls:'white contain',kb:false}),
 mrvid:vid('magride.mp4',{chip:'Audi Magnetic Ride'}),
 mrq:quo('Audi Magnetic Ride · 2007','Ich fühle jede Unebenheit, bevor du sie spürst. Ein Magnetfeld genügt, und aus weich wird straff – ich bin das Fahrwerk, das mit dir mitdenkt.'),

 btitle:`<div class="layer txt"><div class="h m">Leichter.<br>Komplexer.<br>Belastbarer.</div><div class="meta">Bugatti Chiron · 3D-gedruckter Titan-Bremssattel · 2018</div></div>`,
 bq:quo('Bugatti Chiron Bremse','Man hat mich nicht gegossen, man hat mich Schicht für Schicht gedacht. Ich bin fast halb so leicht wie mein geschmiedeter Vorgänger – und halte trotzdem stand, wenn andere längst kapitulieren.'),
 bdet:img('p2_detail.jpg',{cls:'sheen'}),

 chrear:vid('chiron_rear.mp4'),
 bvon:`<div class="layer txt"><div class="h s">Von Höchst&shy;geschwindig&shy;keit zu Kontrolle.</div></div>`,

 rad:img('p4_rad.jpg'),

 // M5 Sicherheit
 pccrash:vid('procon_crash.mp4',{chip:'Audi Procon-Ten · Crashtest'}),
 pcmech:vid('procon_mech.mp4'),
 pcq:quo('Audi Procon-Ten · 1985','Wenn es kracht, ziehe ich mich zurück – nicht aus Feigheit, sondern aus Kalkül. Meine Drahtseile spannen sich, und in dem Moment, in dem alles zu spät scheint, schaffe ich den entscheidenden Zentimeter Freiraum.'),
 pcf:`<div class="layer txt"><div class="kick">Prinzip</div><div class="h s">Rein mechanisch.</div><div class="q" style="margin-top:18px">Der Motor wird beim Aufprall nach hinten gedrückt, ein Stahlseil zieht das Lenkrad vom Fahrer weg und strafft die Gurte.</div></div>`,
 esvw:`<div class="layer txt"><div class="kick">Experimental Safety Volkswagen · 1972</div><div class="h xxl">ESVW 1</div><div class="rule"></div><div class="q l" style="max-width:1100px">„Ich bin nicht gebaut, um zu gefallen – ich bin gebaut, um zu bewahren. Jede meiner Beulen ist eine Antwort auf die Frage, was ein Körper aushält.“</div></div>`,
 n6:nar('Dieselbe Physik, die im Motor Kraft erzeugt, muss hier wieder eingefangen werden.'),

 // M6 Klammer
 k1:img('a2.jpg',{chip:'Leichtbau'}),

 k3:vid('magride.mp4',{chip:'Fahrwerk'}),
 k4:img('p1_bremse.jpg',{cls:'contain',kb:false,chip:'Bremse'}),
 k5:vid('procon_crash.mp4',{chip:'Sicherheitszelle'}),
 kq:nar('Wie beherrscht man die Kräfte, die man selbst erzeugt?',{size:'s',kick:'Kapitel 2'}),
 n7:nar('Leichtbau, Kontaktpunkt, Fahrwerk, Bremse, Sicherheitszelle – fünf Antworten auf eine Kraft, die das Kapitel zuvor selbst erzeugt hat.',{size:'l'}),
};

/* ---------- engine ----------
   Jeder Beat = Folge von Schritten (choreo.js); in jedem Schritt bewegt sich jede Kachel nur auf
   einer Achse. Danach steht der Inhalt so lange, wie man zum Lesen braucht. */
const {MOMENTS,BEATS,SLOTS:NS,collapsed}=CHOREO;
const SLOTS=[...Array(NS)].map((_,i)=>i);
const STEP=850,GAP=60,REVEAL=900;
const stage=document.getElementById('stage');
const tiles={};
const P0=Object.values(CHOREO.P);
const hooks={beat:null,show:null,step:null};
SLOTS.forEach(i=>{const t=document.createElement('div');t.className='tile';t._layers={};t._key=null;t._shownAt=0;stage.appendChild(t);tiles[i]=t});
function initTiles(){SLOTS.forEach(i=>{const t=tiles[i];t._r=i<8?P0[i].slice():[COLS,ROWS,COLS,ROWS];place(t,t._r,true)})}

function layerFor(t,key){
  if(!t._layers[key]){const w=document.createElement('div');w.innerHTML=C[key];const l=w.firstElementChild;l.dataset.key=key;t.appendChild(l);t._layers[key]=l}
  return t._layers[key];
}
const css=v=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v));
function place(t,r,instant){
  const g=css('--gap'),p=css('--pad'),cw=(W-2*p-(COLS-1)*g)/COLS,ch=(H-2*p-(ROWS-1)*g)/ROWS;
  const w=Math.max(0,(r[2]-r[0])*cw+(r[2]-r[0]-1)*g),h=Math.max(0,(r[3]-r[1])*ch+(r[3]-r[1]-1)*g);
  if(instant)t.style.transition='none';
  t.style.left=p+r[0]*(cw+g)+'px';t.style.top=p+r[1]*(ch+g)+'px';t.style.width=w+'px';t.style.height=h+'px';
  t.classList.toggle('collapsed',w===0||h===0);
  if(instant){t.offsetWidth;t.style.transition=''}
}
const relayout=()=>SLOTS.forEach(i=>place(tiles[i],tiles[i]._r));

/* reading time: words of all newly revealed text */
const words=key=>{const d=document.createElement('div');d.innerHTML=C[key]||'';return (d.textContent.trim().match(/\S+/g)||[]).length};
BEATS.forEach(b=>{
  const n=Object.values(b.c).reduce((s,k)=>s+(k.startsWith('s:')?0:words(k)),0);
  b.holdS=b.hold??Math.min(11,Math.max(4.5,2.5+n/3)); // ~3 words per second, 4.5–11 s
  b.revealAt=200+b.steps.length*(STEP+GAP);            // ms after beat start when new content appears
});
let TEMPO=1; // multiplies only the standing time, never the transitions
const durOf=b=>b.revealAt+REVEAL+b.holdS*1000*TEMPO;

let cur=-1,timers=[],timer=null,playing=true,beatStart=0;
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));

function countUp(el,beat){
  const to=parseFloat(el.dataset.count),fmt=el.dataset.fmt,t0=performance.now()+300,d=1600;
  const f=v=>fmt==='dec'?v.toFixed(1).replace('.',','):fmt==='dec2'?v.toFixed(2).replace('.',','):Math.round(v).toLocaleString('de-DE');
  (function step(now){const k=Math.min(1,Math.max(0,(now-t0)/d));el.textContent=f(to*(1-Math.pow(1-k,3)));if(k<1&&cur===beat)requestAnimationFrame(step)})(performance.now());
}
/* canvas effects */
const FX={
  sparks(cv,alive){const ctx=cv.getContext('2d');let ps=[];(function loop(){if(!alive())return;const w=cv.width=cv.clientWidth,h=cv.height=cv.clientHeight;
    for(let i=0;i<6;i++)ps.push({x:w*(.42+Math.random()*.12),y:h*(.55+Math.random()*.2),vx:(Math.random()*2-.6)*9,vy:-Math.random()*9-2,l:1});
    ctx.globalCompositeOperation='lighter';ps=ps.filter(p=>p.l>0);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l-=.022;ctx.strokeStyle=`rgba(255,${150+Math.random()*80|0},40,${p.l})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*1.6,p.y-p.vy*1.6);ctx.stroke()}
    requestAnimationFrame(loop)})()},
  airflow(cv,alive){const ctx=cv.getContext('2d');const t0=performance.now();(function loop(now){if(!alive())return;const w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2,t=(now-t0)/1000;
    ctx.fillStyle='#151517';ctx.fillRect(0,0,w,h);
    const base=h*.72,cx=w*.5,L=w*.62;
    // simplified sports-car profile: hood, roof, fastback
    const prof=x=>{const u=(x-(cx-L/2))/L;if(u<0||u>1)return 0;const hood=.10*Math.sin(Math.PI*Math.min(1,u/.35)*.5);const roof=.30*Math.exp(-Math.pow((u-.52)/.2,2));return h*Math.max(hood,roof)*.9+h*.06*Math.sin(Math.PI*u)};
    ctx.beginPath();ctx.moveTo(cx-L/2,base);for(let x=cx-L/2;x<=cx+L/2;x+=4)ctx.lineTo(x,base-prof(x));ctx.lineTo(cx+L/2,base);ctx.closePath();ctx.fillStyle='#e9e9e9';ctx.fill();
    ctx.lineWidth=3;
    // streamlines hug the body near the surface and relax with distance
    for(let i=0;i<14;i++){const off=h*.03+i*h*.04,decay=Math.exp(-off/(h*.32));ctx.beginPath();
      for(let x=0;x<=w;x+=6)ctx.lineTo(x,base-off-prof(x)*decay);
      ctx.setLineDash([60,40]);ctx.lineDashOffset=-t*260-i*23;ctx.strokeStyle=`rgba(120,200,255,${.8-i*.045})`;ctx.stroke()}
    ctx.setLineDash([]);ctx.fillStyle='#f2f2f2';ctx.font=`600 ${h*.045}px Barlow`;ctx.fillText('PORSCHE 911 · WINDKANALMODELL',w*.05,h*.1);
    ctx.font=`500 ${h*.035}px Barlow`;ctx.globalAlpha=.7;ctx.fillText('Grafik-Platzhalter – Modellfoto fehlt',w*.05,h*.16);ctx.globalAlpha=1;
    requestAnimationFrame(loop)})(t0)},
  discs(cv,alive){const ctx=cv.getContext('2d');const t0=performance.now();(function loop(now){if(!alive())return;const w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2,k=Math.min(1,(now-t0)/1400),e=1-Math.pow(1-k,3);
    ctx.fillStyle='#151517';ctx.fillRect(0,0,w,h);
    const disc=(cx,cy,r,label,sub,col)=>{ctx.lineWidth=r*.18;ctx.strokeStyle=col;ctx.beginPath();ctx.arc(cx,cy,r*.82,-Math.PI/2,-Math.PI/2+Math.PI*2*e);ctx.stroke();
      ctx.lineWidth=4;ctx.strokeStyle='#666';ctx.beginPath();ctx.arc(cx,cy,r*.35,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#f2f2f2';ctx.textAlign='center';ctx.font=`700 ${h*.042}px Barlow`;ctx.fillText(label,cx,cy+r+h*.06);ctx.font=`500 ${h*.03}px Barlow`;ctx.globalAlpha=.7;ctx.fillText(sub,cx,cy+r+h*.1);ctx.globalAlpha=1};
    disc(w*.5,h*.3,w*.3,'PSCB','Serie · Porsche','#d9d9d9');
    disc(w*.5,h*.73,w*.12,'FORMEL E','bremst mit dem Motor','#ffb347');
    requestAnimationFrame(loop)})(t0)},
};

function showContent(t,key,bi,instant){
  const old=t._key?t._layers[t._key]:null;const l=layerFor(t,key);t._key=key;t._shownAt=performance.now()-(instant?1e4:0);
  if(old&&old!==l){old.classList.remove('on');const v=old.querySelector('video');if(v)setTimeout(()=>v.pause(),600)}
  t.appendChild(l); // newest layer on top so its wipe covers the old one
  if(instant){l.style.transition='none';l.classList.add('on');l.offsetWidth;l.style.transition='';}
  else{
    l.querySelectorAll('img').forEach(im=>{im.style.animation='none';im.offsetWidth;im.style.animation=''});
    l.classList.add('on');
    l.querySelectorAll('[data-count]').forEach(el=>countUp(el,bi));
    l.querySelectorAll('canvas.fx').forEach(cv=>FX[cv.dataset.fx]?.(cv,()=>t._key===key&&l.classList.contains('on')));
  }
  const v=l.querySelector('video');if(v){if(!instant)v.currentTime=0;v.play().catch(()=>{})}
  hooks.show?.(t,key,instant);
}

function go(bi){
  timers.forEach(clearTimeout);timers=[];clearTimeout(timer);
  cur=bi;const B=BEATS[bi];
  const changed=Object.entries(B.c).filter(([id,k])=>tiles[id]._key!==k).map(([id])=>+id);
  // old text leaves before the move; old images stay in their frames while the grid moves
  changed.forEach(id=>{const t=tiles[id];if(t._key){const l=t._layers[t._key];if(!l.classList.contains('media-l')){l.classList.remove('on');t._fading=true}}});
  let at=200;
  B.steps.forEach(st=>{
    later(()=>{const moves=[];st.forEach(x=>{const t=tiles[x.id];
      if(x.f&&collapsed(t._r)){t._r=x.f.slice();place(t,t._r,true)} // park at entry edge, invisible
      moves.push({id:x.id,from:t._r.slice(),to:x.r.slice()});
      t._r=x.r.slice();place(t,t._r)});
      hooks.step?.(moves,STEP)},at);
    at+=STEP+GAP;
  });
  later(()=>changed.forEach((id,n)=>setTimeout(()=>{tiles[id]._fading=false;showContent(tiles[id],B.c[id],bi)},n*110)),at);
  beatStart=performance.now();
  hooks.beat?.(B,bi);
  if(playing)timer=setTimeout(next,durOf(B));
}
// browsers occasionally pause a freshly revealed clip; keep every visible clip running
setInterval(()=>document.querySelectorAll('.layer.on video').forEach(v=>{if(v.paused)v.play().catch(()=>{})}),1000);
// the last beat looks exactly like beat 0, so the loop re-syncs invisibly and continues with the title
let range=null; // [first,last] beat – loops just this section when set
function next(){
  if(range){if(cur+1>range[1]||cur<range[0])jump(range[0]);else go(cur+1);return}
  if(cur+1<BEATS.length)go(cur+1);else{resetToStart();go(1)}}
function setRange(r){range=r}
function resetToStart(){timers.forEach(clearTimeout);initTiles();SLOTS.forEach(i=>{const t=tiles[i];t._fading=false;const k=BEATS[0].c[i];if(k)showContent(t,k,0,true);else{if(t._key)t._layers[t._key].classList.remove('on');t._key=null}})}
// jumping: rebuild the exact grid state before beat bi without animation, then play bi
function jump(bi){
  bi=Math.max(0,Math.min(BEATS.length-1,bi));
  resetToStart();
  for(let k=1;k<bi;k++){BEATS[k].steps.forEach(st=>st.forEach(x=>{tiles[x.id]._r=x.r.slice();place(tiles[x.id],x.r,true)}));
    Object.entries(BEATS[k].c).forEach(([id,key])=>{if(tiles[id]._key!==key)showContent(tiles[id],key,k,true)})}
  go(bi);
}
function setPlaying(p){playing=p;if(playing)go(cur);else clearTimeout(timer)}
function setTempo(t){TEMPO=t}
const totalSec=()=>Math.round(BEATS.reduce((s,b)=>s+durOf(b),0)/1000);
function start(){initTiles();resetToStart();setTimeout(()=>go(0),300)}

return {W,H,COLS,ROWS,STEP,C,BEATS,MOMENTS,SLOTS,tiles,hooks,start,go,next,jump,relayout,setPlaying,setTempo,setRange,durOf,totalSec,collapsed,
  get range(){return range},
  get cur(){return cur},get playing(){return playing},get beatStart(){return beatStart},get tempo(){return TEMPO}};
})();

</script>
<script>
/* ================= Wand ================= */
const CW=240,CH=180;                          // eine Zelle = 80 × 60 cm, gleiche Pixel wie im Film
const WW=WAND.COLS*CW,WH=WAND.ROWS*CH;
const wall=document.getElementById('wall');
const {objs,warn}=WAND.layout();
const el=(cls,css,html='')=>{const d=document.createElement('div');d.className=cls;Object.assign(d.style,css);d.innerHTML=html;wall.appendChild(d);return d};
// top / bottom row: no compartments any more – drawn as wall, never lit individually
[0,WAND.ROWS-1].forEach(y=>{const s=el('strip',{top:y*CH+'px'});
  Object.entries(WAND.WALLS).forEach(([n,w])=>{const t=document.createElement('span');t.style.left=(w.off*CW+30)+'px';t.textContent=(y===0?'Wand '+n+' · ':'')+'keine Fächer';s.appendChild(t)})});
// field cells (rows 1–5) except media and door
const inRect=(x,y,r)=>x>=r.c0&&x<=r.c1&&y>=r.y0&&y<=r.y1;
for(let y=WAND.FIELD_ROWS[0];y<=WAND.FIELD_ROWS[1];y++)for(let x=0;x<WAND.COLS;x++)
  if(!inRect(x,y,WAND.MEDIA)&&!inRect(x,y,WAND.DOOR))el('cell',{left:x*CW+'px',top:y*CH+'px'});
const D=WAND.DOOR;el('door',{left:D.c0*CW+'px',top:D.y0*CH+'px',width:(D.c1-D.c0+1)*CW+'px',height:(D.y1-D.y0+1)*CH+'px'},'<span>FLUCHTWEGTÜR</span>');
Object.values(WAND.WALLS).forEach(w=>{if(w.off)el('wallsep',{left:(w.off*CW-2)+'px'})});

// exhibits
const EX={};                                  // Fach-ID → {el, light, level}
objs.forEach(o=>{if(!o.rect)return;const r=o.rect;
  const d=el('ex'+(o.story.includes('2')?' k2':''),{left:r.x*CW+'px',top:r.y*CH+'px',width:r.w*CW+'px',height:r.h*CH+'px'},
    `<div class="body"><div class="pic" style="background-image:url('${(window.ASSETS&&window.ASSETS['exponate/'+o.id+'.jpg'])||'assets/exponate/'+o.id+'.jpg'}')"></div><div class="lit"></div><div class="bar" style="background:${o.color}"></div><div class="nm">${o.name}</div><div class="id">${o.id}</div></div>`);
  d.title=`${o.name} · ${o.id} · ${o.cluster}`;
  EX[o.id]={o,d,pic:d.querySelector('.pic'),lit:d.querySelector('.lit'),nm:d.querySelector('.nm'),level:0,target:0};
});

/* ================= Licht = Film =================
   Jede Kachel, die ein Exponat zeigt, schaltet dessen Fach. Helligkeit = Gewicht × Kachelgröße × Einblendung.
   Klappt eine Kachel weg, verlischt das Licht mit ihr; ein Vollbild setzt einen kurzen Lichtimpuls. */
const K2=['A-A-6','A-C-2','A-D-2','A-A-2','B-E-5','B-B-5','C-A-6','C-A-4','C-A-5','C-D-4','C-C-5','A-G-6'];
const one=(id,w=1)=>[[id,w]],all=w=>K2.map(id=>[id,w]);
const LIGHT={
 's:a2':one('A-A-6',.16),'s:pd':one('A-A-2',.16),'s:pscb':one('C-A-6',.16),'s:procon':one('C-C-5',.16),
 's:det':one('A-C-2',.16),'s:tt':one('A-D-2',.16),'s:mr':one('B-E-5',.16),'s:bremse':one('C-A-5',.16),
 title:all(.22),
 a2:one('A-A-6'),a2lab:one('A-A-6'),a2q:one('A-A-6'),
 det:one('A-C-2'),detlab:one('A-C-2'),detq:one('A-C-2'),tt:one('A-D-2'),ttq:one('A-D-2'),pd:one('A-A-2'),pdq:one('A-A-2'),
 n2:[['A-C-2',.45],['A-D-2',.45],['A-A-2',.45]],
 mrimg:one('B-E-5'),mrvid:one('B-E-5'),mrq:one('B-E-5'),mrf:one('B-E-5'),
 air:one('B-B-5'),airq:one('B-B-5'),airf:one('B-B-5'),n3:one('B-B-5',.6),
 pscb:one('C-A-6'),pscbq:one('C-A-6'),pscbf:one('C-A-6'),discs:[['C-A-4',1],['C-A-6',.6]],feq:one('C-A-4'),n4:[['C-A-6',.5],['C-A-4',.5]],
 chpass:one('C-D-4'),f490:one('C-D-4'),n5:[['C-D-4',.5],['C-A-5',.5]],
 bremse:one('C-A-5'),btitle:one('C-A-5'),bq:one('C-A-5'),bdet:one('C-A-5'),b29:one('C-A-5'),b2213:one('C-A-5'),
 n490:one('C-A-5'),bk:one('C-A-5'),fire:one('C-A-5'),bvon:one('C-A-5'),bz1:one('C-A-5'),bz2:one('C-A-5'),rad:one('C-A-5'),chrear:one('C-D-4',.7),
 pccrash:one('C-C-5'),pcmech:one('C-C-5'),pcq:one('C-C-5'),pcf:one('C-C-5'),esvw:one('A-G-6'),n6:[['C-C-5',.6],['A-G-6',.6]],
 k1:one('A-A-6'),k2:[['A-A-2',1],['A-C-2',.7],['A-D-2',.7]],k3:[['B-E-5',1],['B-B-5',.7]],k4:[['C-A-5',1],['C-A-6',.7],['C-A-4',.7]],k5:[['C-C-5',1],['A-G-6',.7]],
 n7:all(.9),
};
const missing=Object.values(LIGHT).flat().map(x=>x[0]).filter(id=>!EX[id]);
if(missing.length)console.warn('Licht-Zuordnung ohne Fach:',[...new Set(missing)]);

const BR={out:1400,dwell:1700,back:1400,delay:1500};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// target light per Fach at time `now`, derived only from what the film shows (plus the light bridge)
function targets(now){
  const tgt={};
  FILM.SLOTS.forEach(i=>{const t=FILM.tiles[i];if(!t._key||t._fading)return;const L=LIGHT[t._key];if(!L)return;
    const cells=t.offsetWidth*t.offsetHeight/(CW*CH);if(cells<.02)return;
    const size=Math.sqrt(Math.min(1,cells/6)),age=(now-t._shownAt)/1000,ramp=Math.min(1,Math.max(0,age/.7));
    for(const [id,w] of L){let v=w*size*ramp;if(w>=1&&cells>=30&&age<1.8)v+=.45*(1-age/1.8);tgt[id]=Math.max(tgt[id]||0,v)}});
  // light bridge: the referenced object in another chapter lights up for a moment (no travelling spot)
  const B=FILM.BEATS[FILM.cur];
  if(B&&B.bridge&&EX[B.bridge.to]){
    const t=now-FILM.beatStart-B.revealAt-BR.delay,T=BR.out+BR.dwell+BR.back;
    if(t>=0&&t<T&&!B._routed){B._routed=true;route(B.bridge.to,B.bridge.from)}
    if(t>=0&&t<T){const k=t<BR.out?ease(t/BR.out):t<BR.out+BR.dwell?1:1-ease((t-BR.out-BR.dwell)/BR.back);tgt[B.bridge.to]=Math.max(tgt[B.bridge.to]||0,k)}
  }
  return {tgt};
}
let lastT=performance.now(),PICS=false;
function lights(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const {tgt}=targets(now);
  for(const id in EX){const e=EX[id],T=now<(e.holdUntil||0)?0:(tgt[id]||0);e.level+=(T-e.level)*Math.min(1,dt*(T>e.level?7:2.6));
    const v=e.level;e.lit.style.opacity=Math.min(1,v);
    if(PICS){const b=(.28+.72*Math.min(1,v)).toFixed(3);if(e.pb!==b){e.pic.style.opacity=b;e.pb=b}}
    else e.nm.style.color=v>.35?'#2a1f12':'';}
  sweepFrame(now);
  litInfo();
  requestAnimationFrame(lights);
}

/* ================= Bewegungslicht =================
   Jede Kachelbewegung in der Medienfläche läuft in die Fächer daneben weiter – als volle Flächen, exakt im Raster:
   · seitwärts: die Front tritt auf der Seite der Bewegung aus der Medienfläche und füllt Fach für Fach in denselben Reihen
   · auf/ab:    links und rechts der Medienfläche füllen sich die Fächer in der Höhe, die die Kante gerade überstreicht
   Jedes Fach blendet weich ein und aus, mit leicht zufälliger Deckkraft; keine Glows, keine weichen Felder. */
const MO={x:WAND.MEDIA.c0,y:WAND.MEDIA.y0,w:WAND.MEDIA.c1-WAND.MEDIA.c0+1,h:WAND.MEDIA.y1-WAND.MEDIA.y0+1};
const SW={amp:.85,randMin:.35,gain:1.8,reach:7,lateral:3,side:3,rise:180,hold:140,fall:650};
const sweepLayer=document.getElementById('sweep'),SWC=[];
for(let y=WAND.FIELD_ROWS[0];y<=WAND.FIELD_ROWS[1];y++)for(let x=0;x<WAND.COLS;x++){
  if(inRect(x,y,WAND.MEDIA)||inRect(x,y,WAND.DOOR))continue;
  const d=document.createElement('div');d.style.left=x*CW+'px';d.style.top=y*CH+'px';sweepLayer.appendChild(d);SWC.push({x,y,d,v:0})}
// same easing as the tiles: cubic-bezier(.77,0,.18,1)
const bez=(()=>{const x1=.77,y1=0,x2=.18,y2=1,B=(t,a,b)=>3*a*t*(1-t)*(1-t)+3*b*t*t*(1-t)+t*t*t;
  return u=>{let t=u;for(let i=0;i<8;i++){const x=B(t,x1,x2)-u,dx=3*x1*(1-t)*(1-t)+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(dx)<1e-6)break;t-=x/dx;t=Math.min(1,Math.max(0,t))}return B(t,y1,y2)}})();
// moment u∈[0,1] at which the eased motion has covered fraction f
const when=f=>{let lo=0,hi=1;for(let i=0;i<22;i++){const m=(lo+hi)/2;if(bez(m)<f)lo=m;else hi=m}return(lo+hi)/2};
const rnd=()=>SW.randMin+(1-SW.randMin)*Math.random();
let waves=[];
// every moving edge becomes a list of hits: which compartment fills, when, and how strongly
FILM.hooks.step=(moves,dur)=>{
  const now=performance.now(),seen=new Set();
  for(const {from,to} of moves){
    if(FILM.collapsed(from)&&FILM.collapsed(to))continue;           // invisible parking
    for(const [axis,i0,i1,p0,p1] of [['x',0,2,1,3],['y',1,3,0,2]])
      for(const i of [i0,i1]){if(from[i]===to[i])continue;
        const a=from[i],b=to[i],span=[from[p0],from[p1]];if(span[1]-span[0]<=0)continue;
        const key=[axis,a,b,span].join();if(seen.has(key))continue;seen.add(key);
        const hits=[],dist=Math.abs(b-a),dir=Math.sign(b-a);
        SWC.forEach((c,ci)=>{const cx=c.x+.5,cy=c.y+.5;
          if(axis==='x'){                         // front leaves the media on the side of the motion
            const D=dir>0?cx-(MO.x+MO.w):MO.x-cx,row=cy-MO.y;
            if(D<0||D>dist*SW.gain||row<span[0]||row>span[1])return;
            hits.push({ci,at:when(D/(dist*SW.gain))*dur,amp:SW.amp*rnd()*Math.exp(-D/SW.reach)});
          }else{                                  // band at the height of the moving edge, both sides
            const row=cy-MO.y,left=cx<MO.x,dx=left?MO.x-cx:cx-(MO.x+MO.w);
            if(dx<0||dx>SW.lateral||(row-a)*(row-b)>0)return;
            const side=Math.exp(-(left?span[0]:MO.w-span[1])/SW.side);
            hits.push({ci,at:when(Math.abs(row-a)/dist)*dur,amp:SW.amp*rnd()*Math.exp(-dx/SW.lateral)*side});
          }});
        if(hits.length)waves.push({t0:now,hits});
      }}
};
/* Weg zum Highlight: kommt ein Exponat neu ins Licht, läuft die Füllung Fach für Fach von der Medienfläche
   (bzw. bei einer Lichtbrücke vom Ausgangsexponat) in seinen Reihen bis dorthin – das Fach selbst geht erst bei Ankunft an. */
const ROUTE={cellMs:60,ampMin:.6,settle:120};
const SWI={};SWC.forEach((c,i)=>SWI[c.x+','+c.y]=i);
function route(id,originId){
  const e=EX[id];if(!e)return;const now=performance.now();
  if(e.level>.4||(e.routeAt&&now-e.routeAt<3000))return;           // already lit or already on its way
  const r=e.o.rect,o=originId&&EX[originId]?EX[originId].o.rect:{x:MO.x,y:MO.y,w:MO.w,h:MO.h};
  let cols=[];
  if(r.x+r.w<=o.x)for(let x=o.x-1;x>=r.x+r.w;x--)cols.push(x);       // target lies left of the origin
  else if(r.x>=o.x+o.w)for(let x=o.x+o.w;x<r.x;x++)cols.push(x);     // … or right of it
  const hits=[];cols.forEach((x,k)=>{for(let y=r.y;y<r.y+r.h;y++){const ci=SWI[x+','+y];
    if(ci!==undefined)hits.push({ci,at:k*ROUTE.cellMs,amp:ROUTE.ampMin+(1-ROUTE.ampMin)*Math.random()})}});
  if(hits.length)waves.push({t0:now,hits});
  e.routeAt=now;e.holdUntil=now+cols.length*ROUTE.cellMs+ROUTE.settle;
}
FILM.hooks.show=(t,key,instant)=>{if(instant||key.startsWith('s:'))return;
  for(const [id,w] of LIGHT[key]||[])if(w>=.6)route(id)};
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function sweepFrame(now){
  const life=SW.rise+SW.hold+SW.fall;
  waves=waves.filter(w=>w.hits.some(h=>now-w.t0-h.at<life));
  for(const c of SWC)c.v=0;
  for(const w of waves)for(const h of w.hits){const t=now-w.t0-h.at;if(t<0||t>=life)continue;
    const e=t<SW.rise?smooth(t/SW.rise):t<SW.rise+SW.hold?1:1-smooth((t-SW.rise-SW.hold)/SW.fall);
    const c=SWC[h.ci];c.v=Math.max(c.v,h.amp*e)}            // overlapping waves never add up: the stronger one wins
  for(const c of SWC){const v=Math.min(1,c.v);if(Math.abs(v-(c.o||0))>.004){c.d.style.opacity=v.toFixed(3);c.o=v}}
}

/* ================= Kamera: Medienfläche ↔ ganze Wand ================= */
const view=document.getElementById('view'),world=document.getElementById('world'),zoomEl=document.getElementById('zoom');
const M=WAND.MEDIA,MED={x:M.c0*CW,y:M.y0*CH,w:(M.c1-M.c0+1)*CW,h:(M.y1-M.y0+1)*CH};
let zT=0,zC=0;
function camera(){
  const vw=view.clientWidth,vh=view.clientHeight,pad=24;
  const s0=Math.min((vw-2*pad)/MED.w,(vh-2*pad)/MED.h),s1=Math.min((vw-2*pad)/WW,(vh-2*pad)/WH);
  const s=s0*Math.pow(s1/s0,zC);
  const k=(s0/s-1)/(s0/s1-1||1);               // 0 at media, 1 at full wall – linear in visible width
  const cx=(MED.x+MED.w/2)+((WW/2)-(MED.x+MED.w/2))*k,cy=(MED.y+MED.h/2)+((WH/2)-(MED.y+MED.h/2))*k;
  world.style.transform=`translate(${vw/2-cx*s}px,${vh/2-cy*s}px) scale(${s})`;
}
(function camLoop(){zC+=(zT-zC)*.12;if(Math.abs(zT-zC)<1e-4)zC=zT;camera();requestAnimationFrame(camLoop)})();
const setZoom=z=>{zT=Math.max(0,Math.min(1,z));zoomEl.value=zT};
zoomEl.oninput=e=>{zT=+e.target.value};
document.getElementById('zMedia').onclick=()=>setZoom(0);
document.getElementById('zWall').onclick=()=>setZoom(1);
view.addEventListener('wheel',e=>{e.preventDefault();setZoom(zT+e.deltaY*.0012)},{passive:false});
addEventListener('resize',camera);

/* ================= HUD ================= */
const {BEATS,MOMENTS}=FILM;
let infoHead='';
function info(B){
  FILM.BEATS.forEach(b=>b._routed=false);
  const inM=BEATS.filter(b=>b.m===B.m),k=inM.indexOf(B)+1;
  infoHead=`<b>${MOMENTS[B.m]}</b> · Schritt ${k}/${inM.length} — ${B.t} · Register: ${B.reg}${B.warn?` · <span class="warn">⚠ ${B.warn}</span>`:''}`;
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===B.m));
}
FILM.hooks.beat=info;
let lastLit='';
function litInfo(){
  const on=Object.values(EX).filter(e=>e.level>.5).sort((a,b)=>b.level-a.level).map(e=>`${e.o.id} ${e.o.name.replace(/\s*\(.*\)/,'')}`);
  const s=infoHead+`<br><span class="lit">Licht: ${on.length?on.join(' · '):'Grundlicht'}</span>`;
  if(s!==lastLit){document.getElementById('info').innerHTML=s;lastLit=s}
}
const mBox=document.getElementById('moments');
MOMENTS.forEach((m,i)=>{const b=document.createElement('button');b.dataset.m=i;b.textContent=i?'M'+i:'Intro';b.title=m;b.onclick=()=>FILM.jump(BEATS.findIndex(x=>x.m===i));mBox.appendChild(b)});
(function bar(){const B=BEATS[FILM.cur];if(B&&FILM.playing){const k=Math.min(1,(performance.now()-FILM.beatStart)/FILM.durOf(B));document.getElementById('bar').style.width=((FILM.cur+k)/BEATS.length*100)+'%'}requestAnimationFrame(bar)})();
function total(){const sec=FILM.totalSec();document.getElementById('tempo').title='Kapitel-Länge ≈ '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+' min'}
document.getElementById('play').onclick=e=>{FILM.setPlaying(!FILM.playing);e.target.textContent=FILM.playing?'Pause':'Play'};
document.getElementById('prev').onclick=()=>FILM.jump(FILM.cur-1);
document.getElementById('next').onclick=()=>FILM.next();
document.getElementById('tempo').onclick=e=>{const T=[0.75,1,1.25,1.5];FILM.setTempo(T[(T.indexOf(FILM.tempo)+1)%T.length]);e.target.textContent='Standzeit ×'+String(FILM.tempo).replace('.',',');total()};
document.getElementById('pics').onclick=e=>{PICS=document.body.classList.toggle('pics');e.target.classList.toggle('on',PICS);if(PICS)Object.values(EX).forEach(x=>{x.pb=null;x.nm.style.color=''})};
addEventListener('keydown',e=>{if(e.key==='i')document.getElementById('pics').click()});
document.getElementById('labels').onclick=e=>{e.target.classList.toggle('on',!document.body.classList.toggle('nolabels'))};
document.getElementById('fs').onclick=()=>{document.body.classList.add('clean');document.documentElement.requestFullscreen?.();setTimeout(camera,60)};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('clean');setTimeout(camera,60)});
document.getElementById('inv').onclick=e=>{e.target.classList.toggle('on',document.body.classList.toggle('inv'))};
addEventListener('keydown',e=>{if(e.key==='n')document.getElementById('inv').click()});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();document.getElementById('play').click()}if(e.key==='ArrowRight')FILM.next();if(e.key==='ArrowLeft')FILM.jump(FILM.cur-1);
  if(e.key>='0'&&e.key<='6')FILM.jump(BEATS.findIndex(x=>x.m===+e.key));if(e.key==='+')setZoom(zT-.1);if(e.key==='-')setZoom(zT+.1);
  if(e.key==='h'){document.body.classList.toggle('clean');setTimeout(camera,60)}});
if(warn.length)console.warn('Wand-Layout:',warn);
const M2=[FILM.BEATS.findIndex(b=>b.m===2),FILM.BEATS.map(b=>b.m).lastIndexOf(2)];
document.getElementById('section').onclick=e=>{const on=!FILM.range;FILM.setRange(on?M2:null);e.target.classList.toggle('on',on);
  e.target.textContent=on?'Testschleife M2':'Ganzes Kapitel';if(on)FILM.jump(M2[0])};
total();FILM.setRange(M2);FILM.start();setTimeout(()=>FILM.jump(M2[0]),350);requestAnimationFrame(lights);
</script>
</body>
