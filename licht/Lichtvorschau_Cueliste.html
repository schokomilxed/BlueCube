const COLS=35,ROWS=7,CW=34,CH=34,G=3;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=COLS*(CW+G)+G;cv.height=ROWS*(CH+G)+G;
const T={},V={};for(const id in D.kf){T[id]=D.kf[id].map(a=>a[0]);V[id]=D.kf[id].map(a=>a[1]);}
function lev(id,t){const ts=T[id];if(!ts)return 0;let lo=0,hi=ts.length;while(lo<hi){const m=(lo+hi)>>1;if(ts[m]<=t)lo=m+1;else hi=m}
 if(lo==0)return V[id][0];if(lo>=ts.length)return V[id][ts.length-1];const a=ts[lo-1],b=ts[lo];return V[id][lo-1]+(V[id][lo]-V[id][lo-1])*(t-a)/(b-a||1)}
let t=0,playing=true,last=performance.now(),hover=null;

 ctx.fillStyle='#10151f';for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)ctx.fillRect(G+x*(CW+G),G+y*(CH+G),CW,CH);
 for(const id of D.ids){const r=D.info[id].rect,l=lev(id,t);
  const x=G+r.x*(CW+G),y=G+r.y*(CH+G),w=r.w*(CW+G)-G,h=r.h*(CH+G)-G;
  ctx.fillStyle='#1a2233';ctx.fillRect(x,y,w,h);
